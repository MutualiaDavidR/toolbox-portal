<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion - Boîte à outils</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>🧰 Boîte à outils</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit">Se connecter</button>
        <div class="error" id="error-box"></div>
        <a href="#" class="login-link" id="forgot-link">Mot de passe oublié ?</a>
      </form>

      <form id="forgot-form" class="hidden">
        <p class="login-hint">Saisis ton email : si un compte existe, tu recevras un lien pour réinitialiser ton mot de passe.</p>
        <label for="forgot-email">Email</label>
        <input type="email" id="forgot-email" required autocomplete="username">

        <button type="submit" id="forgot-submit">Envoyer le lien</button>
        <div class="error" id="forgot-error"></div>
        <div class="success" id="forgot-success"></div>
        <a href="#" class="login-link" id="back-to-login">← Retour à la connexion</a>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
