<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nouveau mot de passe - Boîte à outils</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>🧰 Nouveau mot de passe</h1>

      <p class="login-hint" id="loading-msg">Vérification du lien...</p>

      <form id="reset-form" class="hidden">
        <label for="new-password">Nouveau mot de passe</label>
        <input type="password" id="new-password" required minlength="6" autocomplete="new-password">

        <label for="confirm-password">Confirmer le mot de passe</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">

        <button type="submit" id="reset-submit">Enregistrer</button>
        <div class="error" id="reset-error"></div>
      </form>

      <div id="invalid-link" class="hidden">
        <p class="error">Ce lien est invalide ou a expiré.</p>
        <a href="index.html" class="login-link">Refaire une demande depuis la page de connexion</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
